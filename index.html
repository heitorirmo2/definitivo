<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Meu Amor ♥</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Great Vibes (Romântica Luxo) & Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- GSAP for smooth animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Canvas Confetti for high quality celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vinhoDark: '#26010B',
            vinhoMedium: '#58081C',
            vinhoLight: '#800020',
            vermelhoLove: '#D90429',
            vermelhoBright: '#EF233C',
            rosaSoft: '#FFF0F3',
            dourado: '#F3C654',
          },
          fontFamily: {
            romantic: ['"Great Vibes"', 'cursive'],
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Background Premium com Gradiente Rico */
    body {
      background: radial-gradient(circle at center, #58081C 0%, #3B020D 50%, #1A0007 100%);
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
    }

    /* Card Glassmorphism com borda dourada suave */
    .glass-card {
      background: rgba(38, 1, 11, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(243, 198, 84, 0.35);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.85), 0 0 20px rgba(217, 4, 41, 0.2);
    }

    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Moldura elegante para fotos */
    .photo-frame {
      border: 4px solid #F3C654;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(0, 0, 0, 0.4);
    }

    /* KEYFRAMES ANIMAÇÕES CSS RICAS */
    /* Coelhinho Beijo */
    @keyframes earWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    .animate-ear-left { animation: earWiggle 1.2s infinite ease-in-out; transform-origin: bottom right; }
    .animate-ear-right { animation: earWiggle 1.2s infinite ease-in-out 0.2s; transform-origin: bottom left; }
    
    @keyframes bunnyKiss {
      0% { transform: scale(0.8) translateY(60px); opacity: 0; }
      40% { transform: scale(1.1) translateY(0); opacity: 1; }
      60% { transform: scale(1.15) translateY(-5px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-bunny-kiss { animation: bunnyKiss 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* Flutuação Pulsante */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.03); }
    }
    .animate-float-slow { animation: floatSlow 3s ease-in-out infinite; }

    /* Borboleta Asas */
    @keyframes butterflyWing {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.2); }
    }
    .animate-wing { animation: butterflyWing 0.3s infinite ease-in-out; }

    /* Brilho Pulsante Dourado */
    @keyframes goldGlow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(243, 198, 84, 0.6)); }
      50% { filter: drop-shadow(0 0 18px rgba(243, 198, 84, 1)); }
    }
    .animate-gold-glow { animation: goldGlow 2s infinite ease-in-out; }

    /* Pulso do Coração */
    @keyframes heartPulse {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.15); }
      100% { transform: scale(0.9); }
    }
    .animate-heart-pulse { animation: heartPulse 1.1s infinite cubic-bezier(0.215, 0.61, 0.355, 1); }
  </style>
</head>
<body class="relative flex flex-col items-center justify-between min-h-screen p-3 md:p-6 select-none">

  <!-- CANVAS DE FUNDO COM CORAÇÕES E PARTÍCULAS -->
  <canvas id="bg-canvas"></canvas>

  <!-- ===================================================================
        MÚSICA DE FUNDO ESCONDIDA 
        =================================================================== -->
  <audio id="bg-music" loop style="display: none;">
    <source src="12.mp3" type="audio/mpeg">
  </audio>

  <!-- CABEÇALHO COM DESIGN MINIMALISTA -->
  <header class="w-full max-w-xl z-20 flex justify-between items-center mb-2 px-2">
    <div class="flex items-center gap-3">
      <span class="text-3xl text-vermelhoBright drop-shadow-md animate-heart-pulse">♥</span>
      <h1 class="font-romantic text-4xl md:text-5xl text-rosaSoft font-bold tracking-wide">Para o Meu Amor</h1>
    </div>

    <!-- Botão de Som Mute/Unmute Discreto -->
    <button id="mute-btn" onclick="toggleAudioState()" class="w-10 h-10 rounded-full bg-vinhoMedium/80 hover:bg-vermelhoLove border border-dourado/40 text-dourado flex items-center justify-center transition-all duration-300 shadow-lg active:scale-90" title="Ligar/Desligar Música">
      <i id="mute-icon" class="fa-solid fa-music text-sm"></i>
    </button>
  </header>

  <!-- CONTEÚDO PRINCIPAL (CARROSSEL 1 POR VEZ) -->
  <main class="w-full max-w-lg z-10 my-auto">
    <div class="glass-card rounded-3xl p-4 md:p-6 text-center relative overflow-hidden">
      
      <!-- CONTADOR DE FOTOS E DICA -->
      <div class="flex items-center justify-between mb-3 text-xs text-rosaSoft/80 font-medium">
        <span id="slide-num" class="bg-vinhoDark/90 text-dourado border border-dourado/30 px-3.5 py-1 rounded-full shadow-inner font-semibold">Foto 1 de 10</span>
        <span class="text-rosaSoft flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles text-dourado animate-spin-slow"></i>Clique na foto ou avance</span>
      </div>

      <!-- MOLDURA E CONTEÚDO DA FOTO DO CARROSSEL -->
      <div onclick="triggerCurrentAnimation()" class="relative w-full aspect-[4/5] sm:aspect-square rounded-2xl overflow-hidden bg-black/60 photo-frame cursor-pointer group">
        
        <!-- IMAGEM EXIBIDA -->
        <img id="carousel-img" src="" alt="Foto do Amor" class="w-full h-full object-cover transition-all duration-500 transform group-hover:scale-105">

        <!-- CAMADA DE ANIMAÇÃO INTERATIVA SVG / CSS DE ALTO PADRÃO -->
        <div id="anim-overlay" class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden z-20"></div>

        <!-- INDICADOR DE INTERAÇÃO NA FOTO -->
        <div class="absolute bottom-2 right-2 bg-vinhoDark/80 border border-dourado/40 text-dourado text-[10px] px-2.5 py-0.5 rounded-full opacity-80 group-hover:opacity-100 transition-opacity flex items-center gap-1">
          <i class="fa-solid fa-hand-pointer text-[9px]"></i> Toque para reagir
        </div>
      </div>

      <!-- FRASE DEDICADA DA FOTO -->
      <div class="mt-4 min-h-[60px] flex items-center justify-center px-2">
        <p id="carousel-caption" class="font-romantic text-3xl md:text-4xl text-rosaSoft leading-relaxed drop-shadow-md">
          <!-- Inserido via JS -->
        </p>
      </div>

      <!-- CONTROLES DE NAVEGAÇÃO -->
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-dourado/20">
        <button onclick="prevSlide()" class="bg-vinhoMedium hover:bg-vinhoLight text-rosaSoft border border-dourado/40 px-5 py-2.5 rounded-full text-xs md:text-sm font-semibold transition-all duration-300 flex items-center gap-2 shadow-lg active:scale-95">
          <i class="fa-solid fa-chevron-left text-dourado"></i> Anterior
        </button>

        <!-- INDICADORES (DOTS) -->
        <div id="dots-container" class="flex gap-1.5 overflow-x-auto max-w-[150px] py-1 px-1"></div>

        <button onclick="nextSlide()" class="bg-vermelhoLove hover:bg-vermelhoBright text-white border border-dourado/40 px-5 py-2.5 rounded-full text-xs md:text-sm font-semibold transition-all duration-300 flex items-center gap-2 shadow-lg active:scale-95">
          Próximo <i class="fa-solid fa-chevron-right text-dourado"></i>
        </button>
      </div>

    </div>
  </main>

  <!-- RODAPÉ SUTIL -->
  <footer class="w-full max-w-lg z-20 text-center mt-2">
    <p class="text-xs text-dourado/70 font-light tracking-wider">Feito especialmente para você, amor da minha vida ♥</p>
  </footer>

  <!-- LÓGICA E ANIMAÇÕES EM JAVASCRIPT -->
  <script>
    /* ---------------------------------------------------
       1. ARRAY DE 10 FOTOS COM FRASES E ANIMAÇÕES
       (Corrigido o erro da segunda foto garantindo a extensão d2.jpeg)
    --------------------------------------------------- */
    const slidesData = [
      { id: 1, img: 'd1.jpeg', caption: 'Seu sorriso é meu lugar favorito no mundo inteirinho!' },
      { id: 2, img: 'd2.jpeg', caption: 'Com você, até os momentos mais simples viram inesquecíveis.' },
      { id: 3, img: 'd3.jpeg', caption: 'Sua beleza reluz mais que o sol e ilumina meus dias.' },
      { id: 4, img: 'd4.jpeg', caption: 'Minha escolha diária, meu amor verdadeiro e infinito.' },
      { id: 5, img: 'd10.jpeg', caption: 'Amo seu olhar doce, seu carinho e cada pedacinho seu.' },
      { id: 6, img: 'd6.jpeg', caption: 'Olhar pra você é ter a certeza de que sonhos se realizam.' },
      { id: 7, img: 'd7.jpeg', caption: 'Seu abraço traz a paz mais perfeita que já experimentei.' },
      { id: 8, img: 'd8.jpeg', caption: 'Estar ao seu lado é viver dentro de um conto de fadas.' },
      { id: 9, img: 'd9.jpeg', caption: 'Você é a minha pessoa favorita em todo o universo!' },
      { id: 10, img: 'd10.jpeg', caption: 'Te amo hoje, amanhã e para todo o sempre! ♥' }
    ];

    let currentIndex = 0;
    let musicStarted = false;

    /* ---------------------------------------------------
       2. MÚSICA DE FUNDO ESCONDIDA (PLAY NO 1º CLIQUE)
    --------------------------------------------------- */
    const bgMusic = document.getElementById('bg-music');
    const muteIcon = document.getElementById('mute-icon');

    function startMusicOnInteraction() {
      if (!musicStarted) {
        bgMusic.play().then(() => {
          musicStarted = true;
          muteIcon.className = 'fa-solid fa-music text-sm text-dourado animate-pulse';
        }).catch(() => {});
      }
    }

    document.addEventListener('click', startMusicOnInteraction, { once: true });

    function toggleAudioState() {
      initAudioCtx();
      if (bgMusic.paused) {
        bgMusic.play();
        musicStarted = true;
        muteIcon.className = 'fa-solid fa-music text-sm text-dourado animate-pulse';
      } else {
        bgMusic.pause();
        muteIcon.className = 'fa-solid fa-volume-xmark text-sm text-rosaSoft';
      }
    }

    /* ---------------------------------------------------
       3. SINTETIZADOR DE SONS FOFOS (WEB AUDIO API)
    --------------------------------------------------- */
    let audioCtx = null;
    function initAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudioCtx();
        const now = audioCtx.currentTime;

        if (type === 'kiss') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(450, now);
          osc.frequency.exponentialRampToValueAtTime(1600, now + 0.15);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
        else if (type === 'sparkle') {
          [523, 659, 783, 1046, 1318].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.06);
            gain.gain.setValueAtTime(0.15, now + idx * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.06);
            osc.stop(now + idx * 0.06 + 0.38);
          });
        }
        else if (type === 'purr') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(500, now);
          osc.frequency.linearRampToValueAtTime(850, now + 0.18);
          osc.frequency.linearRampToValueAtTime(450, now + 0.38);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.42);
        }
        else if (type === 'pop') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(900, now + 0.09);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.09);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }
        else if (type === 'harp') {
          [392, 493, 587, 783, 987].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
            gain.gain.setValueAtTime(0.2, now + idx * 0.09);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.09);
            osc.stop(now + idx * 0.09 + 0.55);
          });
        }
      } catch(e) {}
    }

    /* ---------------------------------------------------
       4. CARROSSEL DE 1 FOTO POR VEZ
    --------------------------------------------------- */
    function renderSlide() {
      const slide = slidesData[currentIndex];
      const imgElem = document.getElementById('carousel-img');
      const captionElem = document.getElementById('carousel-caption');
      const numElem = document.getElementById('slide-num');

      numElem.innerText = `Foto ${currentIndex + 1} de ${slidesData.length}`;
      captionElem.innerText = `"${slide.caption}"`;

      gsap.to(imgElem, { opacity: 0, scale: 0.95, duration: 0.2, onComplete: () => {
        imgElem.src = slide.img;
        imgElem.onerror = () => {
          imgElem.src = 'https://placehold.co/600x600/58081C/F3C654?text=Amor+♥';
        };
        gsap.to(imgElem, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.2)" });
        triggerCuteAnimation(slide.id);
      }});

      renderDots();
    }

    function renderDots() {
      const container = document.getElementById('dots-container');
      container.innerHTML = '';
      slidesData.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = `h-2 rounded-full transition-all duration-300 cursor-pointer ${idx === currentIndex ? 'w-6 bg-dourado' : 'w-2 bg-white/30'}`;
        dot.onclick = () => {
          currentIndex = idx;
          renderSlide();
        };
        container.appendChild(dot);
      });
    }

    function nextSlide() {
      startMusicOnInteraction();
      currentIndex = (currentIndex + 1) % slidesData.length;
      renderSlide();
    }

    function prevSlide() {
      startMusicOnInteraction();
      currentIndex = (currentIndex - 1 + slidesData.length) % slidesData.length;
      renderSlide();
    }

    function triggerCurrentAnimation() {
      triggerCuteAnimation(slidesData[currentIndex].id);
    }

    /* ---------------------------------------------------
       5. ANIMAÇÕES FOFAS E VIBRANTES EM SVG/CSS/CONFETTI
    --------------------------------------------------- */
    function triggerCuteAnimation(id) {
      const overlay = document.getElementById('anim-overlay');
      overlay.innerHTML = '';

      switch(id) {
        case 1:
          playSound('kiss');
          overlay.innerHTML = `
            <div class="animate-bunny-kiss flex flex-col items-center justify-center">
              <svg class="w-36 h-36 md:w-44 md:h-44 drop-shadow-2xl" viewBox="0 0 200 200">
                <ellipse cx="75" cy="45" rx="14" ry="40" fill="#FFF0F3" stroke="#F3C654" stroke-width="3" class="animate-ear-left" />
                <ellipse cx="75" cy="45" rx="7" ry="25" fill="#FFB3C1" class="animate-ear-left" />
                <ellipse cx="125" cy="45" rx="14" ry="40" fill="#FFF0F3" stroke="#F3C654" stroke-width="3" class="animate-ear-right" />
                <ellipse cx="125" cy="45" rx="7" ry="25" fill="#FFB3C1" class="animate-ear-right" />
                <circle cx="100" cy="110" r="50" fill="#FFF0F3" stroke="#F3C654" stroke-width="3" />
                <path d="M 80 100 Q 88 90 92 100" fill="none" stroke="#26010B" stroke-width="4" stroke-linecap="round" />
                <path d="M 108 100 Q 112 90 120 100" fill="none" stroke="#26010B" stroke-width="4" stroke-linecap="round" />
                <circle cx="75" cy="115" r="10" fill="#FF85A1" opacity="0.6" />
                <circle cx="125" cy="115" r="10" fill="#FF85A1" opacity="0.6" />
                <polygon points="97,110 103,110 100,115" fill="#FF4D6D" />
                <circle cx="100" cy="122" r="6" fill="#EF233C" />
              </svg>
              <div id="kiss-hearts" class="absolute -top-4 flex gap-3">
                <span class="text-3xl text-vermelhoBright animate-bounce">💋</span>
                <span class="text-4xl text-vermelhoLove animate-ping">💖</span>
              </div>
            </div>
          `;
          break;

        case 2:
          playSound('harp');
          overlay.innerHTML = `
            <div id="bears-hug" class="flex items-center justify-center gap-1 bg-vinhoDark/85 px-6 py-4 rounded-3xl border-2 border-dourado animate-float-slow shadow-2xl">
              <span class="text-6xl md:text-7xl">🧸</span>
              <span class="text-4xl text-vermelhoBright animate-pulse">💕</span>
              <span class="text-6xl md:text-7xl">🐻</span>
            </div>
          `;
          gsap.from("#bears-hug", { scale: 0, rotate: -15, duration: 0.7, ease: "back.out(1.7)" });
          break;

        case 3:
          playSound('purr');
          overlay.innerHTML = `
            <div id="cat-paw" class="absolute bottom-4 flex flex-col items-center bg-vinhoDark/90 p-4 rounded-3xl border-2 border-dourado shadow-2xl">
              <div class="text-6xl md:text-7xl">🐱</div>
              <div class="text-xs font-bold text-dourado mt-1 flex items-center gap-1">
                <span>Patinha de amor pra você!</span>
                <span class="text-lg">🐾</span>
              </div>
            </div>
          `;
          gsap.from("#cat-paw", { y: 120, duration: 0.6, ease: "power3.out" });
          break;

        case 4:
          playSound('sparkle');
          for(let i=0; i<12; i++) {
            const h = document.createElement('div');
            h.innerText = ['💖', '❤️', '✨', '💕', '💎'][i % 5];
            h.className = 'absolute text-2xl md:text-4xl animate-gold-glow';
            h.style.left = Math.random() * 80 + 10 + '%';
            h.style.top = Math.random() * 80 + 10 + '%';
            overlay.appendChild(h);
            gsap.fromTo(h, 
              { scale: 0, y: 30, opacity: 0 },
              { scale: 1.4, y: -40, opacity: 1, duration: 0.8 + Math.random()*0.5, delay: i * 0.06, ease: "back.out" }
            );
          }
          break;

        case 5:
          playSound('pop');
          overlay.innerHTML = `
            <div id="cupid-box" class="relative flex items-center justify-center">
              <div class="text-7xl md:text-8xl transform -rotate-12">💘</div>
            </div>
          `;
          gsap.fromTo("#cupid-box", 
            { x: -250, scale: 0.2, opacity: 0 },
            { x: 0, scale: 1.2, opacity: 1, duration: 0.7, ease: "elastic.out(1, 0.5)" }
          );
          break;

        case 6:
          playSound('harp');
          overlay.innerHTML = `
            <div id="rose-box" class="flex flex-col items-center justify-center bg-vinhoDark/80 p-5 rounded-full border-2 border-dourado animate-gold-glow">
              <div class="relative">
                <span class="text-7xl md:text-8xl">🌹</span>
                <span class="absolute -top-2 -right-2 text-4xl animate-wing">🦋</span>
              </div>
            </div>
          `;
          gsap.from("#rose-box", { scale: 0, rotate: 180, duration: 0.8, ease: "back.out(1.5)" });
          break;

        case 7:
          playSound('sparkle');
          overlay.innerHTML = `
            <div id="gift-box" class="flex flex-col items-center justify-center">
              <div class="text-7xl md:text-8xl animate-bounce">🎁</div>
              <div id="gift-hearts" class="text-4xl flex gap-2">
                <span>💍</span><span>✨</span><span>💖</span>
              </div>
            </div>
          `;
          gsap.from("#gift-hearts", { scale: 0, y: 20, duration: 0.5, delay: 0.3, ease: "back.out(2)" });
          break;

        case 8:
          playSound('pop');
          overlay.innerHTML = `
            <div id="letter-box" class="flex flex-col items-center justify-center bg-vinhoDark/90 p-4 rounded-2xl border-2 border-dourado">
              <div class="text-6xl md:text-7xl">💌</div>
              <p class="text-xs font-romantic text-2xl text-dourado mt-1">Para meu eterno amor</p>
            </div>
          `;
          gsap.from("#letter-box", { y: -100, opacity: 0, duration: 0.6, ease: "bounce.out" });
          break;

        case 9:
          playSound('sparkle');
          overlay.innerHTML = `
            <div id="star-heart" class="flex items-center justify-center gap-2 text-dourado text-6xl md:text-7xl animate-gold-glow">
              <span>✨</span>
              <span class="text-vermelhoBright text-7xl md:text-8xl">💖</span>
              <span>✨</span>
            </div>
          `;
          gsap.from("#star-heart", { scale: 0, duration: 0.8, ease: "elastic.out(1, 0.4)" });
          break;

        case 10:
          playSound('sparkle');
          confetti({
            particleCount: 100,
            spread: 100,
            origin: { y: 0.55 },
            colors: ['#D90429', '#EF233C', '#F3C654', '#FFF0F3', '#58081C'],
            shapes: ['circle', 'square']
          });
          overlay.innerHTML = `
            <div id="final-love" class="bg-vinhoDark/90 border-2 border-dourado px-6 py-3 rounded-full text-center animate-gold-glow">
              <span class="font-romantic text-3xl md:text-4xl text-dourado">Eu Te Amo Infinitamente! ♥</span>
            </div>
          `;
          gsap.from("#final-love", { scale: 0.2, duration: 0.7, ease: "back.out(1.7)" });
          break;
      }
    }

    /* ---------------------------------------------------
       6. CANVAS DE PARTÍCULAS DE FUNDO
    --------------------------------------------------- */
    function initBgCanvas() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let w = canvas.width = window.innerWidth;
      let h = canvas.height = window.innerHeight;

      window.addEventListener('resize', () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      });

      const particles = Array.from({ length: 30 }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 14 + 8,
        speed: Math.random() * 0.7 + 0.2,
        opacity: Math.random() * 0.6 + 0.2,
        char: ['♥', '✨', '🌸'][Math.floor(Math.random() * 3)]
      }));

      function draw() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => {
          p.y -= p.speed;
          if (p.y < -20) p.y = h + 20;

          ctx.fillStyle = `rgba(243, 198, 84, ${p.opacity})`;
          ctx.font = `${p.size}px serif`;
          ctx.fillText(p.char, p.x, p.y);
        });
        requestAnimationFrame(draw);
      }
      draw();
    }

    window.onload = () => {
      renderSlide();
      initBgCanvas();
    };
  </script>
